<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- page background + mail window -->
  <rect width="800" height="600" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="799" height="599" rx="10" fill="#ffffff" stroke="#cfd6df"/>

  <!-- title bar -->
  <path d="M1 11a10 10 0 0 1 10-10h778a10 10 0 0 1 10 10v25H1z" fill="#e9edf2"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="18" r="6" fill="#febc2e"/>
  <circle cx="60" cy="18" r="6" fill="#28c840"/>
  <text x="400" y="23" text-anchor="middle" font-size="12" fill="#5b6470">Inbox (3) - Mail</text>
  <line x1="1" y1="36" x2="799" y2="36" stroke="#cfd6df"/>

  <!-- sidebar -->
  <path d="M1 36h149v563H11a10 10 0 0 1-10-10z" fill="#f4f6f9"/>
  <line x1="150" y1="36" x2="150" y2="599" stroke="#dfe4ea"/>
  <rect x="14" y="50" width="112" height="34" rx="17" fill="#d6e4fd"/>
  <path d="M34 67h12M40 61v12" stroke="#1b4fbf" stroke-width="2" stroke-linecap="round"/>
  <text x="56" y="72" font-size="13" font-weight="700" fill="#1b4fbf">Compose</text>

  <rect x="8" y="100" width="134" height="28" rx="14" fill="#dfe6f0"/>
  <rect x="20" y="108" width="14" height="11" rx="2" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <path d="M20 113h4l1.5 2.5h3L30 113h4" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <text x="44" y="119" font-size="13" font-weight="700" fill="#1f2937">Inbox</text>
  <text x="132" y="119" font-size="12" font-weight="700" text-anchor="end" fill="#1f2937">3</text>

  <path d="M27 136l2.2 4.5 4.9.7-3.6 3.4.9 4.9-4.4-2.3-4.4 2.3.9-4.9-3.6-3.4 4.9-.7z" fill="none" stroke="#5b6470" stroke-width="1.3" stroke-linejoin="round"/>
  <text x="44" y="147" font-size="13" fill="#3b4350">Starred</text>
  <path d="M20 165l14 5.5-14 5.5 2.5-5.5z" fill="none" stroke="#5b6470" stroke-width="1.3" stroke-linejoin="round"/>
  <text x="44" y="175" font-size="13" fill="#3b4350">Sent</text>
  <path d="M21 192h9l3 3v9H21z" fill="none" stroke="#5b6470" stroke-width="1.3" stroke-linejoin="round"/>
  <text x="44" y="203" font-size="13" fill="#3b4350">Drafts</text>
  <circle cx="27" cy="226" r="6.5" fill="none" stroke="#5b6470" stroke-width="1.3"/>
  <path d="M27 222.5v4.2M27 229v.6" stroke="#5b6470" stroke-width="1.5" stroke-linecap="round"/>
  <text x="44" y="231" font-size="13" fill="#3b4350">Spam</text>
  <text x="132" y="231" font-size="12" text-anchor="end" fill="#5b6470">12</text>
  <path d="M21.5 251h11M23 251l1 10h6l1-10M25.5 251v-2h3v2" fill="none" stroke="#5b6470" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="44" y="259" font-size="13" fill="#3b4350">Trash</text>

  <!-- reading pane toolbar -->
  <path d="M176 54h14M176 54l5-5M176 54l5 5" fill="none" stroke="#4b5563" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="212" y="47" width="16" height="5" rx="1" fill="none" stroke="#4b5563" stroke-width="1.5"/>
  <path d="M214 52v9h12v-9M218 56h4" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M248 49h14M250 49l1 12h8l1-12M253 49v-2.500h4V49" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="282" y="48" width="16" height="12" rx="2" fill="none" stroke="#4b5563" stroke-width="1.5"/>
  <path d="M282.500 49.500l7.500 6 7.500-6" fill="none" stroke="#4b5563" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="742" y="59" font-size="12" text-anchor="end" fill="#5b6470">1 of 3</text>
  <path d="M758 49l-5 5 5 5M772 49l5 5-5 5" fill="none" stroke="#4b5563" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="150" y1="72" x2="799" y2="72" stroke="#e5e9ee"/>

  <!-- subject -->
  <text x="174" y="100" font-size="17" font-weight="700" fill="#111827">[Action required] Critical firmware update 2.4.1 -</text>
  <text x="174" y="122" font-size="17" font-weight="700" fill="#111827">your Halvard One will be locked in 24 hours</text>
  <rect x="548" y="107" width="52" height="20" rx="4" fill="#e5e9ee"/>
  <text x="574" y="121" font-size="11" text-anchor="middle" fill="#4b5563">Inbox</text>

  <!-- sender row -->
  <circle cx="194" cy="158" r="18" fill="#0f1b33"/>
  <path d="M194 147.500l9.100 5.250v10.500l-9.100 5.250-9.100-5.250v-10.500z" fill="none" stroke="#f5a623" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M190.500 153.500v9M197.500 153.500v9M190.500 158h7" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <text x="222" y="155" font-size="14" font-weight="700" fill="#111827">Halvard Security</text>
  <text x="344" y="155" font-size="12.500" fill="#5b6470">&lt;security@halvard-update[.]com&gt;</text>
  <text x="222" y="173" font-size="12" fill="#5b6470">to me</text>
  <path d="M258 167l3.500 4 3.500-4z" fill="#5b6470"/>
  <text x="776" y="155" font-size="12" text-anchor="end" fill="#5b6470">08:12 (2 hours ago)</text>
  <path d="M742 166.500l1.900 3.900 4.300.600-3.100 3 .700 4.300-3.800-2-3.800 2 .700-4.300-3.100-3 4.300-.600z" fill="none" stroke="#5b6470" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M770 169h-8M762 169l3.500-3.500M762 169l3.500 3.500M770 169v6" fill="none" stroke="#5b6470" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- email body card -->
  <rect x="175" y="191" width="602" height="366" rx="8" fill="#0b1220" opacity="0.050"/>
  <rect x="174" y="190" width="602" height="366" rx="8" fill="#ffffff" stroke="#e1e5ea"/>
  <path d="M174 198a8 8 0 0 1 8-8h586a8 8 0 0 1 8 8v38H174z" fill="#0f1b33"/>
  <rect x="174" y="236" width="602" height="3" fill="#f5a623"/>
  <path d="M207 201l10.400 6v12l-10.400 6-10.400-6v-12z" fill="none" stroke="#f5a623" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M203 208v10M211 208v10M203 213h8" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="228" y="218" font-size="15" font-weight="700" letter-spacing="3" fill="#ffffff">HALVARD</text>
  <text x="756" y="218" font-size="12" text-anchor="end" fill="#a9b4c7">Security notice</text>

  <text x="198" y="268" font-size="15" font-weight="700" fill="#111827">Hi Sam,</text>
  <text font-size="14" fill="#2b3340">
    <tspan x="198" y="294">A critical vulnerability has been found in Halvard One firmware 2.3.x.</tspan>
    <tspan x="198" y="314">Our records show that your device (order #HV-20418) is affected.</tspan>
    <tspan x="198" y="342">Install firmware 2.4.1 within 24 hours. Devices that are not updated</tspan>
    <tspan x="198" y="362">will be locked, and your funds may become inaccessible.</tspan>
    <tspan x="198" y="390">Keep your 24-word recovery sheet nearby: you will be asked to</tspan>
    <tspan x="198" y="410">re-verify your device once the update completes.</tspan>
  </text>

  <!-- call to action -->
  <rect x="198" y="430" width="210" height="42" rx="6" fill="#1d6ef0"/>
  <text x="303" y="456" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">Update firmware now</text>
  <text x="424" y="456" font-size="12.500" fill="#5b6470">or open</text>
  <text x="474" y="456" font-size="12.500" fill="#1d6ef0" text-decoration="underline">https://halvard[.]io/firmware</text>

  <line x1="198" y1="494" x2="752" y2="494" stroke="#e5e9ee"/>
  <text x="198" y="516" font-size="12" font-weight="700" fill="#4b5563">Halvard Security Team</text>
  <text x="198" y="536" font-size="11" fill="#7a8494">You are receiving this notice because you registered a Halvard One device.</text>

  <!-- mouse pointer resting on the button -->
  <path d="M384 454v19l4.800-4.300 3.400 7.800 3.300-1.400-3.400-7.700h6.400z" fill="#111827" stroke="#ffffff" stroke-width="1.400" stroke-linejoin="round"/>

  <!-- link preview shown by the mail client while hovering -->
  <path d="M1 578h405a6 6 0 0 1 6 6v15H11a10 10 0 0 1-10-10z" fill="#eef1f5" stroke="#cfd6df"/>
  <text x="10" y="593" font-size="11.500" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#374151">https://halvard-update[.]com/firmware/verify?d=H1-7F3A</text>
</svg>
