  <circle cx="40" cy="19" r="6" fill="#febc2e"/>
  <circle cx="60" cy="19" r="6" fill="#28c840"/>
  <path d="M84 38V16a8 8 0 0 1 8-8h214a8 8 0 0 1 8 8v22z" fill="#ffffff"/>
  <path d="M104 15l6.900 4v8l-6.900 4-6.900-4v-8z" fill="#0f1b33" stroke="#f5a623" stroke-width="1.400" stroke-linejoin="round"/>
