<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- page background + browser window -->
  <rect width="800" height="600" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="799" height="599" rx="10" fill="#f5f7fa" stroke="#cfd6df"/>

