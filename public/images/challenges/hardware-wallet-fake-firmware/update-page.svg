  <path d="M330 17v12M324 23h12" stroke="#4b5563" stroke-width="1.600" stroke-linecap="round"/>

  <!-- address bar -->
  <rect x="1" y="38" width="798" height="38" fill="#ffffff"/>
  <path d="M26 57h-12M14 57l5-5M14 57l5 5" fill="none" stroke="#4b5563" stroke-width="1.700" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 57h12M52 57l-5-5M52 57l-5 5" fill="none" stroke="#b6bdc7" stroke-width="1.700" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M82 52.500a6.500 6.500 0 1 0 1.800 6" fill="none" stroke="#4b5563" stroke-width="1.700" stroke-linecap="round"/>
  <path d="M83.500 48v5h-5" fill="none" stroke="#4b5563" stroke-width="1.700" stroke-linecap="round" stroke-linejoin="round"/>
