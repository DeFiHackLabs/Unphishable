<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 620" width="380" height="620" role="img" aria-label="Wallet popup asking to confirm a transaction">
  <defs>
    <linearGradient id="glyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="summary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2f6b"/>
      <stop offset="1" stop-color="#25252d"/>
    </linearGradient>
    <linearGradient id="sol" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <!-- backdrop and popup shadow -->
  <rect width="380" height="620" fill="#eef0f4"/>
  <rect x="12" y="14" width="360" height="600" rx="14" fill="#0f172a" opacity="0.18"/>

  <g transform="translate(10 10)">
    <rect width="360" height="600" rx="14" fill="#1b1b21"/>

    <!-- header -->
    <rect x="16" y="14" width="28" height="28" rx="8" fill="url(#glyph)"/>
    <circle cx="30" cy="28" r="7" fill="none" stroke="#ffffff" stroke-width="2.4"/>
    <circle cx="36.5" cy="21.5" r="2.4" fill="#ffffff"/>
    <text x="54" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Main Wallet</text>
    <text x="54" y="42" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#9a9aa8">7xKpQ2nV…Tq3Vd8w</text>
    <rect x="268" y="17" width="76" height="22" rx="11" fill="#26262e"/>
    <circle cx="281" cy="28" r="3.5" fill="#34d399"/>
    <text x="290" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#c9c9d4">Mainnet</text>
    <line x1="0" y1="56" x2="360" y2="56" stroke="#2b2b34"/>

    <text x="180" y="84" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Confirm transaction</text>

    <!-- site origin -->
    <rect x="16" y="98" width="328" height="44" rx="10" fill="#25252d"/>
    <circle cx="38" cy="120" r="11" fill="#14b8a6"/>
    <path d="M31.5 124.5 l6.5 -10 l6.5 10 l-6.5 -3.2 z" fill="#ffffff"/>
    <text x="58" y="117" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#ffffff">kestrel-claim[.]app</text>
    <text x="58" y="133" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#9a9aa8">wants you to approve a transaction</text>

    <!-- friendly summary -->
    <rect x="16" y="152" width="328" height="92" rx="12" fill="url(#summary)"/>
    <text x="180" y="178" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#c4c4d2">You will receive</text>
    <text x="180" y="209" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#ffffff">5,000 KSTR</text>
    <text x="180" y="231" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#c4c4d2">Kestrel Airdrop · Season 1 claim</text>

    <!-- estimated balance changes -->
    <text x="16" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#9a9aa8">Estimated balance changes</text>
    <rect x="16" y="278" width="328" height="84" rx="10" fill="#25252d"/>
    <circle cx="38" cy="299" r="10" fill="#14b8a6"/>
    <path d="M32 303 l6 -9 l6 9 l-6 -2.9 z" fill="#ffffff"/>
    <text x="58" y="303.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#ffffff">KSTR</text>
    <text x="328" y="303.5" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#34d399">+5,000 KSTR</text>
    <line x1="28" y1="320" x2="332" y2="320" stroke="#33333d"/>
    <circle cx="38" cy="341" r="10" fill="url(#sol)"/>
    <text x="58" y="345.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#ffffff">SOL</text>
    <text x="328" y="345.5" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f87171">−0.0001 SOL</text>

    <!-- network fee -->
    <text x="16" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#9a9aa8">Network fee</text>
    <text x="344" y="388" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e5e5ee">Paid by site</text>

    <!-- advanced (collapsed) -->
    <rect x="16" y="404" width="328" height="44" rx="10" fill="#25252d"/>
    <text x="30" y="430.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#ffffff">Advanced</text>
    <text x="306" y="430.5" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#9a9aa8">5 instructions</text>
    <path d="M320 420 l6 6 l-6 6" fill="none" stroke="#9a9aa8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="180" y="482" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#8a8a98">Only approve if you trust this site.</text>

    <!-- actions -->
    <line x1="0" y1="510" x2="360" y2="510" stroke="#2b2b34"/>
    <rect x="16" y="528" width="158" height="48" rx="12" fill="#2e2e38"/>
    <text x="95" y="557" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Reject</text>
    <rect x="186" y="528" width="158" height="48" rx="12" fill="#a78bfa"/>
    <text x="265" y="557" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#1b1b21">Approve</text>
  </g>
</svg>
