    <!-- readme -->
    <text x="24" y="298" font-size="20" font-weight="700" fill="#111111">eslint-plugin-unused-imports</text>
    <rect x="24" y="307" width="446" height="1" fill="#eaeaea"/>
    <text x="24" y="330" font-size="13" fill="#333333">Find and remove unused es6 module imports. It works by splitting</text>
    <text x="24" y="349" font-size="13" fill="#333333">up the no-unused-vars rule depending on it being an import</text>
    <text x="24" y="368" font-size="13" fill="#333333">statement in the AST, and providing an autofix rule to remove</text>
    <text x="24" y="387" font-size="13" fill="#333333">the nodes if they are imports.</text>
    <text x="24" y="422" font-size="16" font-weight="700" fill="#111111">Installation</text>
    <rect x="24" y="431" width="446" height="1" fill="#eaeaea"/>
    <rect x="24" y="442" width="446" height="34" rx="4" fill="#f6f8fa"/>
    <text x="36" y="463" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#24292f">npm install eslint-plugin-unused-imports --save-dev</text>
    <text x="24" y="506" font-size="16" font-weight="700" fill="#111111">Usage</text>
    <rect x="24" y="515" width="446" height="1" fill="#eaeaea"/>
    <rect x="24" y="526" width="446" height="70" rx="4" fill="#f6f8fa"/>
    <text x="36" y="547" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#24292f">import unusedImports from "eslint-plugin-unused-imports";</text>
    <text x="36" y="565" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#24292f">plugins: { "unused-imports": unusedImports },</text>
    <text x="36" y="583" font-size="12" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#24292f">rules: { "unused-imports/no-unused-imports": "error" }</text>

