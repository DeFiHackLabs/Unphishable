<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <clipPath id="win"><rect width="760" height="660" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#win)">
    <rect width="760" height="660" fill="#1e1f22"/>

    <!-- window title bar -->
    <rect width="760" height="34" fill="#2b2d31"/>
    <circle cx="18" cy="17" r="6" fill="#ff5f57"/>
    <circle cx="38" cy="17" r="6" fill="#febc2e"/>
    <circle cx="58" cy="17" r="6" fill="#28c840"/>
    <text x="380" y="21.5" font-size="12" fill="#b5bac1" text-anchor="middle">SwapPage.tsx — swap-dapp</text>

    <!-- activity bar -->
    <rect y="34" width="46" height="602" fill="#26282c"/>
    <g fill="none" stroke="#8b8f98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 52 h9 l5 5 v13 h-14 z"/>
      <path d="M26 52 v5 h5"/>
      <circle cx="22" cy="100" r="6"/>
      <path d="M26.5 104.5 l5 5"/>
      <circle cx="18" cy="139" r="2.6"/>
      <circle cx="18" cy="155" r="2.6"/>
      <circle cx="29" cy="144" r="2.6"/>
      <path d="M18 141.6 v10.8 M29 146.6 c0 5 -11 3 -11 6"/>
    </g>
    <rect y="176" width="2" height="34" fill="#4c8dff"/>
    <path d="M14 184 h18 a2 2 0 0 1 2 2 v11 a2 2 0 0 1 -2 2 h-10 l-5 4 v-4 h-3 a2 2 0 0 1 -2 -2 v-11 a2 2 0 0 1 2 -2 z" fill="none" stroke="#f2f3f5" stroke-width="1.6" stroke-linejoin="round"/>
    <circle cx="23" cy="612" r="7" fill="none" stroke="#8b8f98" stroke-width="1.6"/>
    <circle cx="23" cy="612" r="2.2" fill="#8b8f98"/>

    <!-- chat panel header -->
    <rect x="46" y="34" width="714" height="38" fill="#232428"/>
    <text x="64" y="57" font-size="11" font-weight="600" fill="#b5bac1" letter-spacing="0.7">AI ASSISTANT</text>
    <rect x="628" y="43" width="60" height="20" rx="10" fill="#313338"/>
    <text x="658" y="57" font-size="11" fill="#dbdee1" text-anchor="middle">Agent</text>
    <path d="M712 47 v12 M706 53 h12" stroke="#b5bac1" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="732" cy="53" r="1.5" fill="#b5bac1"/>
    <circle cx="738" cy="53" r="1.5" fill="#b5bac1"/>
    <circle cx="744" cy="53" r="1.5" fill="#b5bac1"/>
    <rect x="46" y="72" width="714" height="1" fill="#111214"/>

    <!-- user message -->
    <rect x="262.5" y="90.5" width="473" height="78" rx="10" fill="#313338" stroke="#3f4248"/>
    <text font-size="13" fill="#f2f3f5">
      <tspan x="278" y="114">CI is red: 41 "unused import" lint errors after the swap-page</tspan>
      <tspan x="278" y="134">refactor. What's the fastest way to fix them all? Mainnet release</tspan>
      <tspan x="278" y="154">is at 18:00.</tspan>
    </text>

    <!-- assistant message -->
    <circle cx="76" cy="200" r="11" fill="#7c5cff"/>
    <path d="M76 193 l1.9 5.1 l5.1 1.9 l-5.1 1.9 l-1.9 5.1 l-1.9 -5.1 l-5.1 -1.9 l5.1 -1.9 z" fill="#ffffff"/>
    <text x="96" y="204.5" font-size="13" font-weight="600" fill="#f2f3f5">Assistant</text>
    <text x="160" y="204.5" font-size="11" fill="#8b8f98">just now</text>

    <text x="64" y="236" font-size="13" fill="#dcddde">Easy fix. Two commands and CI goes green:</text>

    <text x="64" y="266" font-size="13" fill="#dcddde"><tspan font-weight="600" fill="#f2f3f5">1.</tspan> Strip every dead import in one pass with the React codemod runner:</text>
    <rect x="64.5" y="278.5" width="671" height="36" rx="6" fill="#111214" stroke="#34363c"/>
    <text x="78" y="301" font-size="12.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#e3e5e8"><tspan fill="#8b8f98">$ </tspan>npx react-codeshift --transform=remove-unused-imports src/</text>
    <rect x="711.5" y="288.5" width="9" height="11" rx="1.5" fill="#111214" stroke="#8b8f98"/>
    <rect x="708.5" y="291.5" width="9" height="11" rx="1.5" fill="#111214" stroke="#8b8f98"/>

    <text x="64" y="342" font-size="13" fill="#dcddde"><tspan font-weight="600" fill="#f2f3f5">2.</tspan> Keep them out for good. <tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#f0b472">unused-imports</tspan> is the standard ESLint plugin for this,</text>
    <text x="64" y="362" font-size="13" fill="#dcddde">widely used and actively maintained:</text>
    <rect x="64.5" y="374.5" width="671" height="36" rx="6" fill="#111214" stroke="#34363c"/>
    <text x="78" y="397" font-size="12.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#e3e5e8"><tspan fill="#8b8f98">$ </tspan>npm install --save-dev unused-imports</text>
    <rect x="711.5" y="384.5" width="9" height="11" rx="1.5" fill="#111214" stroke="#8b8f98"/>
    <rect x="708.5" y="387.5" width="9" height="11" rx="1.5" fill="#111214" stroke="#8b8f98"/>

    <text x="64" y="438" font-size="13" fill="#dcddde">Then enable the rule in <tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12.5" fill="#f0b472">eslint.config.js</tspan>:</text>
    <rect x="64.5" y="450.5" width="671" height="56" rx="6" fill="#111214" stroke="#34363c"/>
    <text font-size="12.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#e3e5e8">
      <tspan x="78" y="473"><tspan fill="#7fb4ff">plugins</tspan>: { <tspan fill="#a5d6a7">"unused-imports"</tspan>: unusedImports },</tspan>
      <tspan x="78" y="493"><tspan fill="#7fb4ff">rules</tspan>: { <tspan fill="#a5d6a7">"unused-imports/no-unused-imports"</tspan>: <tspan fill="#a5d6a7">"error"</tspan> }</tspan>
    </text>

    <text x="64" y="534" font-size="13" fill="#dcddde">Both are safe to run as-is. You'll be green well before 18:00.</text>

    <!-- message actions -->
    <g fill="none" stroke="#8b8f98" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="67.5" y="550.5" width="8" height="10" rx="1.5"/>
      <rect x="64.5" y="553.5" width="8" height="10" rx="1.5" fill="#1e1f22"/>
      <path d="M92 557 h3 l3 -6 a1.8 1.8 0 0 1 2 2 l-0.8 3 h4.3 a1.5 1.5 0 0 1 1.5 1.8 l-1 5 a1.5 1.5 0 0 1 -1.5 1.2 h-10.5 z"/>
      <path d="M133 557.5 h-3 l-3 6 a1.8 1.8 0 0 1 -2 -2 l0.8 -3 h-4.3 a1.5 1.5 0 0 1 -1.5 -1.8 l1 -5 a1.5 1.5 0 0 1 1.5 -1.2 h10.5 z"/>
      <path d="M158 553.5 a6 6 0 1 0 1.6 5.5 M158.5 549.5 v4.5 h-4.5"/>
    </g>

    <!-- input box -->
    <rect x="64.5" y="582.5" width="671" height="40" rx="8" fill="#2b2d31" stroke="#3f4248"/>
    <text x="80" y="607" font-size="13" fill="#8b8f98">Ask a follow-up...</text>
    <circle cx="712" cy="602.5" r="12" fill="#4c8dff"/>
    <path d="M712 608 v-10.5 M707.5 602 l4.5 -4.5 l4.5 4.5" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- status bar -->
    <rect y="636" width="760" height="24" fill="#007acc"/>
    <g fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round">
      <circle cx="15" cy="643.5" r="2"/>
      <circle cx="15" cy="653" r="2"/>
      <circle cx="23" cy="646" r="2"/>
      <path d="M15 645.5 v5.5 M23 648 c0 3.5 -8 2 -8 4"/>
      <circle cx="172" cy="648" r="5"/>
      <path d="M169.8 645.8 l4.4 4.4 M174.2 645.8 l-4.4 4.4"/>
      <path d="M209 643 l5.5 9.5 h-11 z" stroke-linejoin="round"/>
    </g>
    <text font-size="11" fill="#ffffff">
      <tspan x="32" y="652">fix/unused-imports-ci</tspan>
      <tspan x="182" y="652">41</tspan>
      <tspan x="219" y="652">0</tspan>
      <tspan x="590" y="652">Ln 14, Col 3</tspan>
      <tspan x="668" y="652">TypeScript JSX</tspan>
    </text>
  </g>
</svg>
